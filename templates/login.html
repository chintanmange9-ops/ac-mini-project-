<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — Encrypted</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
<script src="/static/crypto.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Space+Grotesk:wght@600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>:root{--bg:#0f172a;--card:#1e293b;--line:#334155;--muted:#94a3b8;--text:#e2e8f0;--green:#22c55e;--sky:#38bdf8;--red:#f87171}
*{box-sizing:border-box}
body{font-family:"Plus Jakarta Sans",Segoe UI,Arial,sans-serif;margin:0;min-height:100vh;color:var(--text);background:radial-gradient(900px 500px at 10% -10%,rgba(56,189,248,.14),transparent 60%),radial-gradient(800px 500px at 110% 110%,rgba(34,197,94,.10),transparent 60%),var(--bg);display:flex;justify-content:center;align-items:flex-start;padding:48px 16px}
h1,h2{font-family:"Space Grotesk",sans-serif;letter-spacing:-.02em;margin:0 0 6px}
h2{font-size:24px}
a{color:var(--sky);text-decoration:none}a:hover{text-decoration:underline}
.brand{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sky);background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.25);padding:5px 10px;border-radius:999px;margin-bottom:14px}
.brand:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
form,.card{background:linear-gradient(180deg,rgba(30,41,59,.96),rgba(30,41,59,.88));border:1px solid var(--line);border-radius:18px;padding:32px;box-shadow:0 30px 60px -30px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.04);animation:rise .5s cubic-bezier(.2,.8,.2,1) both;transition:width .35s ease}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.sub{font-size:13px;color:var(--muted);margin:0 0 20px;line-height:1.5}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:14px 0 6px;letter-spacing:.02em}
input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:#0b1222;color:var(--text);font:inherit;font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s}
input::placeholder{color:#475569}
input:focus{border-color:var(--sky);box-shadow:0 0 0 4px rgba(56,189,248,.15)}
input:user-invalid{border-color:var(--red);box-shadow:0 0 0 4px rgba(248,113,113,.12)}
input:valid:not(:placeholder-shown){border-color:rgba(34,197,94,.55)}
button{width:100%;padding:13px;border:0;border-radius:10px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;margin-top:12px;position:relative;transition:transform .15s,filter .2s,box-shadow .2s}
button:hover{filter:brightness(1.08);transform:translateY(-1px)}button:active{transform:none}
button.ghost{background:transparent;color:var(--muted);border:1px dashed var(--line)}
button.ghost:hover{color:var(--text);border-color:var(--muted)}
button.busy{color:transparent!important;pointer-events:none}
button.busy:after{content:"";position:absolute;inset:0;margin:auto;width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(8,47,73,.35);border-top-color:#082f49;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#err:not(:empty){margin-top:14px;padding:12px 14px 12px 40px;border-radius:10px;background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.35);color:#fecaca;font-size:13px;position:relative;animation:shake .35s}
#err:not(:empty):before{content:"!";position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;border-radius:50%;background:var(--red);color:#450a0a;font-weight:800;font-size:12px;display:grid;place-items:center}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
#out{margin-top:16px;padding:16px;border-radius:12px;display:none;word-break:break-word;font-size:14px;line-height:1.6;animation:rise .4s both}
.foot{margin:22px 0 0;font-size:13px;color:var(--muted);text-align:center}
@media(max-width:520px){body{padding:20px 10px}form,.card{padding:22px;border-radius:14px}}
form{width:1080px;max-width:100%}form.narrow{width:420px}
button.primary{background:var(--sky);color:#082f49;box-shadow:0 12px 30px -14px var(--sky)}
#out{background:transparent;border:0;padding:0;margin-top:22px}
#out>b:first-of-type{color:var(--green)}
div.subtabs{display:flex;gap:4px;margin:16px 0 18px;padding:4px;background:#0b1222;border:1px solid var(--line);border-radius:12px;overflow-x:auto}
button.subtab{width:auto;flex:1;white-space:nowrap;margin:0;padding:10px 16px;background:transparent;color:var(--muted);border-radius:9px;font-weight:600}
button.subtab:hover{color:var(--text);transform:none}
button.subtab.on{background:var(--sky);color:#082f49;box-shadow:0 6px 18px -8px var(--sky)}
#pane0,#pane1,#pane2{animation:rise .35s both}
table{border-collapse:separate;border-spacing:0;font-size:13px;margin-top:10px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
table.mine{width:100%;margin-bottom:16px}
table.mine td{padding:10px 14px;border-bottom:1px solid var(--line)}
table.mine tr:last-child td{border-bottom:0}
table.mine td:first-child{color:var(--muted);font-family:"JetBrains Mono",monospace;font-size:12px;width:35%;background:rgba(15,23,42,.5)}
table.mine tr:nth-child(even) td{background:rgba(15,23,42,.35)}
div.wrap{overflow:auto;max-height:62vh;border:1px solid var(--line);border-radius:12px;margin-top:10px}
div.wrap table{border:0;border-radius:0;margin:0;overflow:visible}
table#dbtable{table-layout:fixed;width:100%;min-width:1400px;font-size:11.5px;font-family:"JetBrains Mono",monospace}
table#dbtable th,table#dbtable td{padding:8px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);word-break:break-all;overflow-wrap:anywhere;vertical-align:top}
table#dbtable th{position:sticky;top:0;z-index:3;background:#0b1222;color:var(--sky);text-align:left;font-weight:600;user-select:none;font-family:"Plus Jakarta Sans",sans-serif;text-transform:uppercase;letter-spacing:.04em;font-size:10.5px}
table#dbtable tr:nth-child(odd) td{background:rgba(15,23,42,.45)}
table#dbtable tr:hover td{background:rgba(56,189,248,.08)}
div.resizer{position:absolute;right:-4px;top:0;width:9px;height:100%;cursor:col-resize;z-index:4}
div.resizer:hover{background:var(--sky);opacity:.6}
div.flow{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
div.step{background:#0b1222;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:12px;flex:1;min-width:130px;line-height:1.5;transition:border-color .2s,transform .2s}
div.step:hover{border-color:var(--sky);transform:translateY(-2px)}
div.arr{align-self:center;color:var(--sky);font-weight:700}
#calls>div{background:#0b1222}
@media(max-width:640px){div.arr{display:none}div.step{min-width:100%}}
</style>
</head><body>
<form id="loginform" class="narrow" onsubmit="return false">
<div class="brand">Step 2 · Login</div>
<h2>Student Login</h2>
<p class="sub">SAP ID travels locked, password travels as fingerprint only.</p>
<label for="sap_id">Login ID</label><input id="sap_id" placeholder="Login ID = SAP ID" required>
<label for="password">Password</label><input id="password" type="password" placeholder="Strong password" required>
<button class="primary" onclick="withSpin(this,doLogin)">Encrypt &amp; Login</button>
<div id="err"></div><div id="out"></div>
<p class="foot"><a href="/">← Home</a></p>
</form>
<script>async function withSpin(b,fn){b.classList.add("busy");try{await fn();}finally{b.classList.remove("busy");}}</script>
<script>const BD_URL="{{ bd_url }}";
const callLog=[];
async function apiCall(path,body){
  const url=BD_URL+path;
  callLog.push({method:'POST',url:url,headers:'Content-Type: application/json',body:JSON.stringify(body)});
  return fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
}
function short(s){s=String(s);return s.length>26?s.slice(0,26)+'…':s;}
function callsHTML(){
  if(!callLog.length)return '<p>No calls yet.</p>';
  let h='';
  callLog.forEach(c=>{h+='<div style="border:1px solid #334155;border-radius:8px;padding:8px;margin:6px 0;font-size:12px"><b>'+c.method+'</b> '+c.url+'<br>Headers: '+c.headers+'<br>Body:<br><span style="word-break:break-all;font-family:monospace;font-size:11px">'+c.body+'</span></div>';});
  return h;
}
async function doLogin(){
  document.getElementById('err').textContent='';
  const sap=document.getElementById('sap_id').value.trim(), pwd=document.getElementById('password').value;
  if(!sap||!pwd){document.getElementById('err').textContent='Both fields required.';return;}
  const iv=CryptoProvider.randomIV();
  const payload={sap_id_enc:CryptoProvider.encryptField(sap,iv),sap_id_hash:CryptoProvider.sha256(sap),
    password_hash:CryptoProvider.sha256(pwd),iv,algo:CryptoProvider.ALGO,key_version:CryptoProvider.KEY_VERSION};
  const r=await apiCall('/api/login',payload);
  const j=await r.json();
  if(!r.ok){document.getElementById('err').textContent=j.error||'Login failed';return;}
  const name=CryptoProvider.decryptField(j.name_enc,j.iv);
  const pr=await apiCall('/api/profile',payload);
  const pf=await pr.json();
  if(!pr.ok){document.getElementById('err').textContent=pf.error||'Could not load record';return;}
  const F=['roll_no','sap_id','name','sem','branch'];
  let rows='';
  F.forEach(f=>{rows+='<tr><td>'+f+'</td><td><b>'+CryptoProvider.decryptField(pf[f+'_enc'],pf.iv)+'</b></td></tr>';});
  const out=document.getElementById('out');out.style.display='block';
  document.getElementById('loginform').classList.remove('narrow');
  out.innerHTML='Login success. Welcome, <b>'+name+'</b><br>'
    +'<div class="subtabs"><button class="subtab on" onclick="showPane(0,this)">Your record</button>'
    +'<button class="subtab" onclick="showPane(1,this)">Workflow + calls</button>'
    +'<button class="subtab" onclick="showPane(2,this)">Full DB</button></div>'
    +'<div id="pane0">Your record in DB (decrypted with your key):<table class="mine">'+rows+'</table></div>'
    +'<div id="pane1" style="display:none">'+renderTransparency(pf)+'</div>'
    +'<div id="pane2" style="display:none"><b>Full stored DB (all rows, locked) — login required to see this:</b><div id="dbtbl"><p>Loading DB…</p></div></div>';
  loadFullDB(payload);
}
function renderTransparency(pf){
  const F=['roll_no','sap_id','name','sem','branch'];
  let m='';
  F.forEach(f=>{
    const plain=CryptoProvider.decryptField(pf[f+'_enc'],pf.iv);
    const ok=CryptoProvider.sha256(plain)===pf[f+'_hash'];
    m+='<tr><td>'+f+'</td><td><b>'+(ok?'✓ MATCH':'✗ FAIL')+'</b></td><td title="'+pf[f+'_hash']+'">'+short(pf[f+'_hash'])+'</td><td title="'+pf[f+'_enc']+'">'+short(pf[f+'_enc'])+'</td></tr>';
  });
  return '<br><b>Workflow — how your data travelled:</b>'
    +'<div class="flow">'
    +'<div class="step">① You type plaintext<br>(screen only, never sent)</div><div class="arr">→</div>'
    +'<div class="step">② Browser locks it<br>TES-128 + SHA256</div><div class="arr">→</div>'
    +'<div class="step">③ POST to BD<br>ciphertext + hash only</div><div class="arr">→</div>'
    +'<div class="step">④ BD unlocks,<br>remakes hash, matches</div><div class="arr">→</div>'
    +'<div class="step">⑤ SQLite stores<br>locked + hash only</div>'
    +'</div>'
    +'<p style="font-size:12px">Registered at <b>'+pf.created_at+'</b> · verified just now.</p>'
    +'<b>Exact calls FD → BD (this session):</b><div id="calls">'+callsHTML()+'</div>'
    +'<b>Integrity check (recomputed live):</b><table class="mine"><tr><td><b>field</b></td><td><b>result</b></td><td><b>stored fingerprint</b></td><td><b>stored locked copy</b></td></tr>'+m+'</table>';
}
async function loadFullDB(payload){
  try{
    const r=await apiCall('/api/db-preview',payload);
    const rows=await r.json();
    if(!r.ok){document.getElementById('dbtbl').innerHTML='<p>DB unavailable: '+(rows.error||r.status)+'</p>';return;}
    if(!rows.length){document.getElementById('dbtbl').innerHTML='<p>No rows.</p>';return;}
    const cols=['id','roll_no_enc','roll_no_hash','sap_id_enc','sap_id_hash','name_enc','name_hash','sem_enc','sem_hash','branch_enc','branch_hash','password_hash','iv','key_version','created_at'];
    let h='<div class="wrap"><table id="dbtable"><tr>';
    cols.forEach(c=>{h+='<th>'+c+'</th>';});
    h+='</tr>';
    rows.forEach(w=>{h+='<tr>';cols.forEach(c=>{h+='<td title="'+w[c]+'">'+w[c]+'</td>';});h+='</tr>';});
    document.getElementById('dbtbl').innerHTML=h+'</table></div><p style="font-size:12px">'+rows.length+' row(s) — full values, all ciphertext + hash.</p>';
    makeResizable(document.getElementById('dbtable'));
    if(document.getElementById('calls'))document.getElementById('calls').innerHTML=callsHTML();
  }catch(e){document.getElementById('dbtbl').innerHTML='<p>Cannot reach BD.</p>';}
}
function showPane(i,btn){
  [0,1,2].forEach(n=>{document.getElementById('pane'+n).style.display=(n===i?'block':'none');});
  btn.parentElement.querySelectorAll('.subtab').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
}
function makeResizable(table){
  table.querySelectorAll('th').forEach(th=>{
    const h=document.createElement('div');h.className='resizer';th.appendChild(h);
    h.addEventListener('mousedown',e=>{
      e.preventDefault();
      const startX=e.pageX,startW=th.offsetWidth;
      function mv(ev){th.style.width=Math.max(50,startW+ev.pageX-startX)+'px';}
      function up(){document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);}
      document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
    });
  });
}
</script>
</body></html>
